name: Continuous integration

on:
  pull_request:
  push:
    branches: [develop]

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      source: ${{ steps.filter.outputs.source }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            source:
              - 'src/**'
              - 'tests/**'
              - 'benchmarks/**'
              - 'performance/**'
              - 'samples/**'
              - 'AnyProtocol.slnx'
              - 'Directory.Build.*'
              - 'Directory.Packages.props'
              - 'NuGet.config'
              - 'global.json'

  build-test:
    needs: changes
    if: needs.changes.outputs.source == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANYPROTOCOL_REQUIRE_BROKER_TESTS: 'true'
    steps:
      - uses: actions/checkout@v7
      - run: dotnet restore AnyProtocol.slnx --locked-mode
      - run: dotnet build AnyProtocol.slnx -c Release --no-restore
      - run: dotnet test AnyProtocol.slnx -c Release --no-build --logger "trx;LogFileName=tests.trx"
      - name: Collect coverage
        shell: pwsh
        run: |
          $coverageRoot = Join-Path $env:GITHUB_WORKSPACE 'artifacts/coverage'
          New-Item -ItemType Directory -Force -Path $coverageRoot | Out-Null
          $projects = Get-ChildItem tests -Recurse -Filter '*.csproj' | Sort-Object FullName
          foreach ($project in $projects) {
            $outputPath = Join-Path $coverageRoot $project.BaseName
            New-Item -ItemType Directory -Force -Path $outputPath | Out-Null
            $coverletOutput = $outputPath + [IO.Path]::DirectorySeparatorChar
            dotnet test $project.FullName -c Release --no-build --no-restore --verbosity quiet `
              /p:CollectCoverage=true /p:CoverletOutputFormat=cobertura `
              "/p:CoverletOutput=$coverletOutput"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results
          path: '**/TestResults/*.trx'
          if-no-files-found: warn
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: artifacts/coverage
          if-no-files-found: warn

  package-validation:
    needs: changes
    if: needs.changes.outputs.source == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - run: dotnet restore AnyProtocol.slnx --locked-mode
      - run: dotnet pack src/AnyProtocol/AnyProtocol.csproj -c Release --no-restore
      - run: dotnet list AnyProtocol.slnx package --vulnerable --include-transitive --no-restore
