name: Performance smoke

on:
  pull_request:
  push:
    branches: [develop]

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      source: ${{ steps.filter.outputs.source }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            source:
              - 'src/**'
              - 'tests/**'
              - 'benchmarks/**'
              - 'performance/**'
              - 'samples/**'
              - 'AnyProtocol.slnx'
              - 'Directory.Build.*'
              - 'Directory.Packages.props'
              - 'NuGet.config'
              - 'global.json'

  smoke:
    needs: changes
    if: needs.changes.outputs.source == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.300
      - run: dotnet restore AnyProtocol.slnx
      - run: dotnet build AnyProtocol.slnx -c Release --no-restore
      - run: dotnet test tests/AnyProtocol.Performance.Tests/AnyProtocol.Performance.Tests.csproj -c Release --no-build
      - run: dotnet run --project benchmarks/AnyProtocol.Benchmarks -c Release --no-build -- --job short --filter "*CodecBenchmarks*" --artifacts artifacts/benchmarks-smoke
      - run: dotnet run --project performance/AnyProtocol.LoadTests -c Release --no-build -- --matrix smoke --operations 1000 --warmup 100 --json artifacts/performance/smoke.json --markdown artifacts/performance/smoke.md
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: performance-smoke
          path: |
            artifacts/benchmarks-smoke
            artifacts/performance
