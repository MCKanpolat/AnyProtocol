name: Performance full

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  full:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.300
      - run: dotnet restore AnyProtocol.slnx
      - run: dotnet build AnyProtocol.slnx -c Release --no-restore
      - name: Start brokers
        run: docker compose -f samples/docker-compose.yml up -d
      - name: Wait for brokers
        run: |
          timeout 120 sh -c 'until docker compose -f samples/docker-compose.yml exec -T rabbitmq rabbitmq-diagnostics -q ping; do sleep 2; done'
          timeout 120 sh -c 'until docker compose -f samples/docker-compose.yml exec -T kafka /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1; do sleep 2; done'
      - name: Run full matrix with confirmation gate
        run: >-
          dotnet run --project performance/AnyProtocol.LoadTests -c Release --no-build --
          --matrix full
          --rabbitmq-uri amqp://guest:guest@localhost:5672/
          --kafka-bootstrap localhost:9092
          --operations 10000
          --warmup 1000
          --baseline performance/baselines/linux-x64.json
          --threshold 0.20
          --confirm-regressions
          --json artifacts/performance/full.json
          --markdown artifacts/performance/full.md
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: performance-full
          path: artifacts/performance
      - name: Stop brokers
        if: always()
        run: docker compose -f samples/docker-compose.yml down --volumes
